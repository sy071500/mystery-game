<title>설월장 수사 파일</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Pen+Script&family=Noto+Serif+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 한밤의 책상 위에 펼친 사건 파일. 왼쪽 색인 탭(장소·인물) / 가운데 현장 평면도·심문 / 오른쪽 단서 보드와 붉은 실 */
:root{
  --desk:#151b27;
  --desk-hi:#1f2737;
  --line:#2d374a;
  --paper:#ebe5d6;
  --paper-edge:#cdc4ae;
  --manila:#d3b775;
  --ink:#23262d;
  --ink-soft:#5b5f69;
  --red:#c4372d;
  --lamp:#f0c25a;
  --muted:#8f99ac;
  --chalk:#dfe6f2;
  --f-display:"Black Han Sans","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-hand:"Nanum Pen Script","Noto Serif KR",cursive;
  --f-mono:"Nanum Gothic Coding","D2Coding",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:
    radial-gradient(1200px 700px at 12% -10%, rgba(240,194,90,.13), transparent 60%),
    var(--desk);
  color:var(--chalk);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

.app{max-width:1320px;margin:0 auto;display:grid;gap:20px;
  grid-template-columns:210px minmax(0,1fr) 360px;
  grid-template-areas:"head head head" "side main board";}
@media (max-width:1080px){.app{grid-template-columns:200px minmax(0,1fr);grid-template-areas:"head head" "side main" "board board"}}
@media (max-width:720px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "side" "main" "board"}}

/* 헤더: 사건 파일 표지 */
.head{grid-area:head;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;
  border-bottom:1px dashed var(--line);padding-bottom:16px}
.file-no{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.15;margin:4px 0 0;text-wrap:balance;color:var(--paper)}
.head h1 em{font-style:normal;color:var(--lamp)}
.head-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count b{color:var(--paper);font-size:18px}
.stamp{font-family:var(--f-display);color:var(--red);border:3px solid var(--red);padding:2px 10px;transform:rotate(-6deg);
  letter-spacing:.1em;font-size:18px;opacity:.9;border-radius:4px}
.mock-note{width:100%;font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* 사이드: 색인 탭 */
.side{grid-area:side;display:flex;flex-direction:column;gap:22px;min-width:0}
.side h2,.board h2{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.tabs{display:flex;flex-direction:column;gap:6px}
@media (max-width:720px){.tabs{flex-direction:row;flex-wrap:wrap}}
.tab{background:var(--manila);color:var(--ink);border:0;text-align:left;padding:8px 12px;border-radius:2px 10px 10px 2px;
  font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;
  box-shadow:inset 3px 0 0 rgba(0,0,0,.15);transition:transform .15s}
.tab:hover{transform:translateX(3px)}
.tab[aria-current="true"]{background:var(--paper);box-shadow:inset 4px 0 0 var(--red)}
.tab.locked{background:#3a4253;color:var(--muted)}
.tab small{font-family:var(--f-mono);font-size:11px;font-weight:400;opacity:.75}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:720px){.people{grid-template-columns:repeat(4,minmax(0,1fr))}}
.person{background:none;border:0;padding:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.person .ph{width:100%;max-width:88px;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--paper);
  border:3px solid var(--paper);box-shadow:0 4px 10px rgba(0,0,0,.4);transition:transform .15s}
.person:hover .ph{transform:rotate(-3deg) scale(1.04)}
.person[aria-current="true"] .ph{border-color:var(--lamp)}
.person span{font-size:13px;font-weight:600;line-height:1.2}
.person small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);line-height:1.2}

/* 메인 패널 */
.main{grid-area:main;min-width:0;background:var(--desk-hi);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:14px}
.main-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.main-head h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;color:var(--paper)}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.btn{background:transparent;border:1px solid var(--line);border-radius:4px;padding:6px 12px;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn-red{background:var(--red);border-color:var(--red);color:#fff;font-family:var(--f-display);font-size:17px;padding:10px 18px;letter-spacing:.04em}
.btn-red:hover{filter:brightness(1.1)}

/* 평면도 */
.plan-wrap{background:#0f1520;border-radius:4px;position:relative;
  background-image:linear-gradient(rgba(143,153,172,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(143,153,172,.07) 1px,transparent 1px);
  background-size:24px 24px}
.plan{display:block;width:100%;height:auto}
.plan .wall{fill:none;stroke:var(--chalk);stroke-width:6}
.plan .thin{fill:none;stroke:var(--muted);stroke-width:1.5}
.plan .fur{fill:rgba(223,230,242,.06);stroke:var(--muted);stroke-width:1.5}
.plan .label{fill:var(--muted);font-family:var(--f-mono);font-size:12px}
.plan .body-outline{fill:none;stroke:var(--chalk);stroke-width:2;stroke-dasharray:6 5}
.plan .fire{fill:var(--line);stroke:var(--muted)}
.hot{cursor:pointer}
.hot circle.dot{fill:var(--lamp)}
.hot circle.ring{fill:none;stroke:var(--lamp);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
.hot.done circle.dot{fill:var(--muted)}
.hot.done circle.ring{display:none}
.hot.lock circle.dot{fill:var(--red)}
.hot text{fill:var(--paper);font-family:var(--f-body);font-size:13px;font-weight:600;paint-order:stroke;stroke:#0f1520;stroke-width:4px}
.hot:focus{outline:none}
.hot:focus-visible circle.dot{stroke:#fff;stroke-width:3}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}

/* 심문 */
.interro{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:520px){.interro{grid-template-columns:minmax(0,1fr)}}
.big-ph{width:100%;max-width:200px;aspect-ratio:1;background:var(--paper);border:5px solid var(--paper);box-shadow:0 8px 20px rgba(0,0,0,.45);transform:rotate(-2deg)}
.big-ph.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px) rotate(-3deg)}40%{transform:translateX(6px) rotate(-1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.talk{display:flex;flex-direction:column;gap:12px;min-width:0}
.who{font-family:var(--f-display);font-size:24px;color:var(--paper);line-height:1.1}
.who small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.bubble{background:var(--paper);color:var(--ink);padding:14px 16px;border-radius:2px;position:relative;font-size:16px;line-height:1.7;min-height:90px;
  box-shadow:0 3px 0 var(--paper-edge)}
.bubble.new::after{content:"새 진술";position:absolute;top:-10px;right:10px;background:var(--red);color:#fff;font-family:var(--f-mono);font-size:11px;padding:1px 8px;border-radius:2px}
.row-label{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);letter-spacing:.1em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.chip:hover{border-color:var(--lamp);color:var(--lamp)}
.chip.ev{border-style:dashed}
.empty{font-size:13px;color:var(--muted)}

/* 단서 보드 */
.board{grid-area:board;min-width:0;display:flex;flex-direction:column;gap:10px}
.cork{position:relative;min-height:320px;border-radius:6px;padding:18px 14px 22px;
  background:#2a2f3a;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1.5px);background-size:9px 9px;
  border:1px solid var(--line);
  display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;align-content:start}
.threads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.threads line{stroke:var(--red);stroke-width:2;stroke-linecap:round;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.card{position:relative;z-index:1;background:var(--paper);color:var(--ink);padding:8px 8px 10px;box-shadow:0 6px 14px rgba(0,0,0,.45);
  transform:rotate(var(--r,0deg));transition:transform .2s}
.card:hover{transform:rotate(0) scale(1.03);z-index:3}
.card::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
  background:var(--red);box-shadow:inset -2px -2px 0 rgba(0,0,0,.25),0 2px 2px rgba(0,0,0,.4);z-index:4}
.card .photo{background:#cfd5de;aspect-ratio:4/3;display:grid;place-items:center;color:#2f3a4d;position:relative}
.card .photo svg{width:46%;height:auto}
.card .id{position:absolute;left:6px;top:4px;font-family:var(--f-mono);font-size:10.5px;font-weight:700;color:#2f3a4d}
.card .tp{position:absolute;right:6px;top:4px;font-family:var(--f-mono);font-size:10.5px;color:var(--red);border:1px solid var(--red);padding:0 4px;border-radius:2px}
.card h3{font-family:var(--f-body);font-weight:700;font-size:14px;margin:8px 2px 2px;line-height:1.3}
.card p{font-size:12.5px;line-height:1.5;margin:0 2px;color:var(--ink-soft)}
.card.note{background:#f3dc7a;padding:12px 12px 14px}
.card.note h3{font-family:var(--f-hand);font-weight:400;font-size:22px;margin:0 0 2px}
.card.note p{font-family:var(--f-hand);font-size:20px;line-height:1.2;color:#3d3520}
.card.note .by{font-family:var(--f-mono);font-size:10.5px;color:#6b5d2f;display:block;margin-top:6px}
.card.fresh{animation:pin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pin{from{transform:translateY(-30px) rotate(12deg) scale(1.15);opacity:0}}
.cork-empty{grid-column:1/-1;font-family:var(--f-hand);font-size:24px;color:var(--muted);text-align:center;padding-top:60px}

.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* 토스트 */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:3px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5);
  transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* 추리쇼 */
.show{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;
  background:#07090e;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.show[hidden]{display:none}
.show::before{content:"";position:absolute;inset:-50%;
  background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(240,194,90,.10) 0deg 2deg, transparent 2deg 9deg);
  animation:spin 60s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.show-inner{position:relative;max-width:900px;width:100%;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;align-items:center}
@media (max-width:640px){.show-inner{grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center}}
.show-step{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--lamp)}
.show-line{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,64px);line-height:1.12;color:#fff;margin:8px 0 14px;text-wrap:balance;
  text-shadow:4px 4px 0 var(--red)}
.show-sub{font-size:clamp(15px,2vw,19px);color:var(--chalk);max-width:34em;margin:0}
.show .card{width:200px;--r:6deg}
.show .card.slam{animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(2.6) rotate(-20deg);opacity:0}}
.show.quake .show-inner{animation:quake .4s}
@keyframes quake{25%{transform:translate(-8px,4px)}50%{transform:translate(7px,-5px)}75%{transform:translate(-4px,2px)}}
.show-ctrl{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.show-ctrl .btn{background:rgba(0,0,0,.5);border-color:#444c5c;color:#fff}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<div class="app">
  <header class="head">
    <div>
      <div class="file-no">사건 파일 No.01 · 강원도 설월장</div>
      <h1>설월장의 <em>마지막 목소리</em></h1>
    </div>
    <div class="head-right">
      <div class="count">획득 단서 <b id="cnt">0</b> / 26</div>
      <div class="stamp" aria-hidden="true">수사중</div>
    </div>
    <div class="mock-note">아트 방향 시안 · 수사 파일 스타일 · 이 시안에서는 서재 조사와 심문, 추리쇼 미리보기를 해 볼 수 있어요</div>
  </header>

  <aside class="side">
    <section>
      <h2>장소</h2>
      <div class="tabs" id="places"></div>
    </section>
    <section>
      <h2>관계자</h2>
      <div class="people" id="people"></div>
    </section>
  </aside>

  <main class="main" id="main"></main>

  <section class="board">
    <h2>단서 보드</h2>
    <div class="cork" id="cork">
      <svg class="threads" id="threads" aria-hidden="true"></svg>
    </div>
    <div class="foot">
      <span class="hint">관련된 단서는 붉은 실로 이어져요</span>
      <button class="btn btn-red" id="showBtn">추리쇼 미리보기</button>
    </div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="추리쇼">
  <div class="show-inner" id="showInner"></div>
  <div class="show-ctrl">
    <button class="btn" id="showNext">다음 ▸</button>
    <button class="btn" id="showClose">닫기</button>
  </div>
</div>

<script>
(function(){
/* ---------- 아이콘 (단서 사진 대용) ---------- */
const G = {
  watch:'<circle cx="24" cy="24" r="12"/><path d="M24 24V16M24 24l6 3M20 6h8v6h-8zM20 36h8v6h-8z"/>',
  crown:'<circle cx="22" cy="24" r="12"/><path d="M22 24V16M22 24l6 3M34 22h8v4h-8z"/>',
  ladder:'<path d="M16 6v36M32 6v36M16 12h16M16 20h16M16 28h16M16 36h16"/>',
  wound:'<rect x="15" y="15" width="18" height="18" transform="rotate(12 24 24)"/><path d="M10 40c6-4 22-4 28 0" stroke-dasharray="3 3"/>',
  bookend:'<path d="M10 40h28M14 40V12h9v28"/><path d="M30 40V22" stroke-dasharray="3 3"/>',
  fire:'<path d="M8 40h32M12 40V18h24v22"/><path d="M24 36c-5-1-6-6-3-10 0 3 2 4 2 1 3 2 5 8 1 9z"/>',
  speaker:'<rect x="15" y="7" width="18" height="34" rx="3"/><circle cx="24" cy="29" r="6"/><circle cx="24" cy="15" r="2"/><path d="M38 18c3 4 3 8 0 12M42 14c5 6 5 14 0 20"/>',
  monitor:'<rect x="7" y="9" width="34" height="23" rx="1"/><path d="M24 32v6M15 39h18M12 16h14M12 21h20M12 26h10"/>',
  phone:'<rect x="15" y="5" width="18" height="38" rx="3"/><path d="M19 13h10M19 18h7"/><circle cx="31" cy="11" r="3" fill="currentColor"/>',
  letter:'<rect x="7" y="12" width="34" height="24"/><path d="M7 12l17 14 17-14"/>'
};
const glyph = k => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${G[k]}</svg>`;

/* ---------- 단서 ---------- */
const CLUES = {
  C01:{t:'물증',n:'멈춘 손목시계',d:'유리가 깨진 채 22:31에 멈춰 있다.',g:'watch'},
  C02:{t:'관찰',n:'당겨진 용두',d:'용두가 시간 조정 위치로 빠져 있다. 넘어진 충격으로는 이렇게 되지 않는다.',g:'crown'},
  C03:{t:'관찰',n:'먼지 쌓인 사다리',d:'발판에 먼지가 그대로다. 발자국이 하나도 없다.',g:'ladder'},
  C04:{t:'관찰',n:'사각형 상처',d:'후두부에 각진 모서리 자국. 둥근 사다리 봉과는 모양이 맞지 않는다.',g:'wound'},
  C05:{t:'물증',n:'짝 잃은 북엔드',d:'청동 북엔드 한 쌍 중 하나가 없다.',g:'bookend'},
  C06:{t:'관찰',n:'꺼진 벽난로',d:'불이 꺼져 있다. 옆 장작 상자는 가득 차 있다.',g:'fire'},
  C07:{t:'관찰',n:'최대 볼륨 스피커',d:'평소 꺼 두던 스마트 스피커가 최대 볼륨으로 올라가 있다.',g:'speaker'},
  C08:{t:'기록',n:'스마트홈 예약 기록',d:'"22:30 재생: memo_0912.m4a / 예약 생성 21:51"',g:'monitor'},
  C09:{t:'기록',n:'읽지 않은 메시지',d:'21:50 윤채아의 메시지가 읽지 않음 상태. 마지막 사용 21:41.',g:'phone'},
  C10:{t:'기록',n:'협박장',d:'"15년 전 「겨울 해바라기」의 진짜 주인을 기억하라"',g:'letter'},
  S01:{note:1,by:'강태오',n:'그날 밤 행적',d:'"9시 반부터 10시 직전까지 샤워했죠. 그 뒤론 계속 보드게임."'},
  S02:{note:1,by:'오순자',n:'10시의 장작',d:'"주인어른은 매일 밤 10시 정각에 장작을 넣으세요. 하루도 안 빼먹고요."'},
  S03:{note:1,by:'오순자',n:'22:30의 목소리',d:'"그때 저희 조용히 게임하고 있었는데… \'시끄럽다\'라니요?"'},
  S06:{note:1,by:'윤채아',n:'PC 비밀번호',d:'"선생님 PC요? 비밀번호는 제가 관리해요. 열어 드릴게요."'}
};
const LINKS = [['C06','S02'],['C03','C04'],['C01','C02'],['C07','S03'],['C07','C08'],['C05','C04']];

/* ---------- 인물 초상 (평면 벡터) ---------- */
const P = {
  minjae:{name:'서민재',role:'조카 · 29',bg:'#b9c3d4',skin:'#f0cfb4',hair:'#2b2622',cloth:'#5a6e8c',style:'messy'},
  chaea:{name:'윤채아',role:'비서 · 34',bg:'#d7c3c0',skin:'#f3d6c2',hair:'#3a2a26',cloth:'#2f3440',style:'bob',glasses:1},
  taeo:{name:'강태오',role:'미술 평론가 · 45',bg:'#c8ccb6',skin:'#e7c3a3',hair:'#4a4642',cloth:'#6b4a3a',style:'slick',glasses:0,beard:1},
  sunja:{name:'오순자',role:'가정부 · 58',bg:'#d6cfb2',skin:'#efcdb0',hair:'#8e8a86',cloth:'#7a8c6a',style:'bun'}
};
function portrait(p, ex){
  ex = ex || 'calm';
  const hair = {
    messy:'<path d="M28 42c-2-16 10-25 22-25s25 8 22 25c-3-6-6-9-9-10 1 3 0 5-2 6-2-4-6-7-11-7-3 3-8 6-14 6-3 1-6 3-8 5z"/>',
    bob:'<path d="M26 48c-3-20 8-31 24-31s27 11 24 31l-2 12c-3-2-4-6-4-12-1-9-6-14-12-17-6 4-15 6-22 6-1 7-1 15-3 23l-3-12z"/>',
    slick:'<path d="M29 40c0-15 10-22 22-22 13 0 21 8 20 22-3-8-9-12-17-12-9 0-16 4-25 12z"/>',
    bun:'<circle cx="50" cy="15" r="9"/><path d="M28 44c-2-16 9-24 22-24s24 8 22 24c-4-9-12-13-22-13s-18 4-22 13z"/>'
  }[p.style];
  const brow = {calm:'M38 39h8M54 39h8',shaken:'M38 37l8-2M54 35l8 2',angry:'M38 36l8 4M54 40l8-4'}[ex];
  const eyes = ex==='shaken'
    ? '<circle cx="42" cy="46" r="3.2" fill="#fff" stroke="#23262d" stroke-width="1.6"/><circle cx="58" cy="46" r="3.2" fill="#fff" stroke="#23262d" stroke-width="1.6"/><circle cx="42" cy="46" r="1.1" fill="#23262d"/><circle cx="58" cy="46" r="1.1" fill="#23262d"/>'
    : '<path d="M39 46h6M55 46h6" stroke="#23262d" stroke-width="2.6" stroke-linecap="round"/>';
  const mouth = {calm:'M45 59q5 3 10 0',shaken:'M46 60q4-4 8 0q-4 3-8 0',angry:'M44 61q6-4 12 0'}[ex];
  return `<svg viewBox="0 0 100 100" aria-hidden="true">
    <rect width="100" height="100" fill="${p.bg}"/>
    <path d="M8 100c3-20 18-28 42-28s39 8 42 28z" fill="${p.cloth}"/>
    <path d="M40 76l10 10 10-10" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
    <rect x="43" y="60" width="14" height="16" fill="${p.skin}"/>
    <ellipse cx="50" cy="46" rx="20" ry="23" fill="${p.skin}"/>
    ${p.beard?'<path d="M34 54c2 12 9 16 16 16s14-4 16-16c-4 5-9 7-16 7s-12-2-16-7z" fill="'+p.hair+'" opacity=".85"/>':''}
    <g fill="${p.hair}">${hair}</g>
    <path d="${brow}" stroke="${p.hair}" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    ${eyes}
    ${p.glasses?'<g fill="none" stroke="#23262d" stroke-width="1.6"><rect x="35" y="41" width="13" height="10" rx="3"/><rect x="52" y="41" width="13" height="10" rx="3"/><path d="M48 45h4"/></g>':''}
    <path d="M50 49l-2 6h3" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/>
    <path d="${mouth}" stroke="#23262d" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${ex==='shaken'?'<path d="M70 34q3 5 0 8q-3-3 0-8z" fill="#8fc3e8"/>':''}
    ${ex==='angry'?'<path d="M68 28l4 3-4 3M74 26l4 4-4 4" stroke="'+'#c4372d'+'" stroke-width="2.2" fill="none"/>':''}
  </svg>`;
}

/* ---------- 심문 데이터 ---------- */
const TALK = {
  minjae:{intro:'"저, 저는 방에 있었어요! 큰아버지 일이랑은 아무 상관 없다고요."',
    topics:[{l:'22:30에 어디 있었나',a:'"방이요. 방에 있었다니까요… 왜 자꾸 물어보세요?"',ex:'shaken'}],
    react:{C05:{a:'"북엔드요? 서재 물건엔 손 안 대요. 큰아버지가 질색하셨거든요."',ex:'calm'}},
    def:'"그게 저랑 무슨 상관인데요?"'},
  chaea:{intro:'"선생님 일정은 전부 제가 관리했어요. 필요한 게 있으면 말씀하세요."',
    topics:[{l:'서재 PC',a:CLUES.S06.d,get:'S06',unlock:1,ex:'calm'}],
    react:{C09:{a:'"…그 메시지, 제가 보낸 거 맞아요. 하지만 답장은 끝내 안 오셨어요."',ex:'shaken'}},
    def:'"죄송하지만 그건 잘 모르겠네요."'},
  taeo:{intro:'"진혁이와는 30년 지기입니다. 이런 일이 생기다니… 믿기지가 않는군요."',
    topics:[{l:'그날 밤 행적',a:CLUES.S01.d,get:'S01',ex:'calm'}],
    react:{C05:{a:'"북엔드요? 원래 하나만 있었던 거 아닙니까. 그런 사소한 걸 다 기억하진 못하죠."',ex:'calm'},
           C10:{a:'"…「겨울 해바라기」. 진혁이 대표 소장품이죠. 그게 왜요?"',ex:'angry'}},
    def:'"탐정님, 그건 사건과 관계없어 보이는데요."'},
  sunja:{intro:'"20년을 이 집에서 일했어요. 주인어른 습관이라면 뭐든 물어보세요."',
    topics:[{l:'주인어른의 밤 습관',a:CLUES.S02.d,get:'S02',ex:'calm'},
            {l:'22:30에 들린 목소리',a:CLUES.S03.d,get:'S03',ex:'shaken'}],
    react:{C06:{a:'"장작이 그대로라고요? 그럴 리가… 10시엔 꼭 넣으시는데. 그럼 그때 이미…"',ex:'shaken'}},
    def:'"글쎄요, 그건 처음 보는 물건이네요."'}
};

/* ---------- 현장 핫스팟 ---------- */
const SPOTS = [
  {id:'body',x:150,y:150,l:'시신',clues:['C04']},
  {id:'wrist',x:205,y:182,l:'손목',clues:['C01','C02']},
  {id:'ladder',x:100,y:76,l:'사다리',clues:['C03']},
  {id:'shelf',x:318,y:42,l:'서가',clues:['C05']},
  {id:'fire',x:532,y:132,l:'벽난로',clues:['C06']},
  {id:'speaker',x:500,y:350,l:'스피커',clues:['C07']},
  {id:'pc',x:470,y:192,l:'PC',clues:['C08'],lock:1},
  {id:'phone',x:404,y:212,l:'휴대폰',clues:['C09']},
  {id:'drawer',x:392,y:252,l:'서랍',clues:['C10']}
];

/* ---------- 상태 ---------- */
const S = {got:[], view:'scene', who:null, ex:'calm', line:'', fresh:null, newLine:false, pc:false};
const has = id => S.got.includes(id);
const $ = s => document.querySelector(s);

function gain(id){
  if(has(id)) return false;
  S.got.push(id); S.fresh = id;
  toast(`단서 획득: ${CLUES[id].n}`);
  return true;
}
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- 렌더 ---------- */
const PLACES = [
  {n:'서재',s:'현장'},{n:'거실',s:''},{n:'정원',s:''},{n:'보일러실',s:'잠김',lock:1},{n:'수장고',s:'잠김',lock:1}
];
function renderSide(){
  $('#places').innerHTML = PLACES.map((p,i)=>
    `<button class="tab${p.lock?' locked':''}" data-place="${i}" aria-current="${i===0&&S.view==='scene'}">${p.n}<small>${p.s}</small></button>`).join('');
  $('#people').innerHTML = Object.entries(P).map(([k,p])=>
    `<button class="person" data-who="${k}" aria-current="${S.view==='talk'&&S.who===k}">
       <div class="ph">${portrait(p)}</div><span>${p.name}</span><small>${p.role}</small></button>`).join('');
}

function planSVG(){
  const spots = SPOTS.map(s=>{
    const done = s.clues.every(has), locked = s.lock && !S.pc;
    return `<g class="hot${done?' done':''}${locked?' lock':''}" data-spot="${s.id}" tabindex="0" role="button" aria-label="${s.l} 조사${locked?' (잠김)':''}">
      <circle class="ring" cx="${s.x}" cy="${s.y}" r="10"/><circle class="dot" cx="${s.x}" cy="${s.y}" r="7"/>
      <text x="${s.x+12}" y="${s.y+5}">${s.l}${locked?' 🔒':''}</text></g>`;
  }).join('');
  return `<svg class="plan" viewBox="0 0 600 400" role="img" aria-label="서재 평면도">
    <rect class="wall" x="20" y="20" width="560" height="360"/>
    <path d="M250 380h80" stroke="#0f1520" stroke-width="8"/><path class="thin" d="M250 380a80 80 0 0 1 80-80"/>
    <path d="M20 170v100" stroke="#8fb3d9" stroke-width="6"/>
    <text class="label" x="30" y="292">창문 (폭설)</text>
    <rect class="fur" x="60" y="26" width="320" height="28"/>
    ${Array.from({length:30},(_,i)=>`<path class="thin" d="M${66+i*10.5} 30v20" opacity=".5"/>`).join('')}
    <g class="thin"><path d="M88 56v40M114 56v40M88 66h26M88 76h26M88 86h26"/></g>
    <path class="body-outline" d="M120 130c10-8 30-6 36 4l40 18c10 4 16 14 10 22l-30 2-40 8c-14 2-24-4-26-14l-6-22c-2-8 6-14 16-18z"/>
    <rect class="fur" x="360" y="170" width="150" height="90"/>
    <rect class="fur" x="455" y="178" width="34" height="24"/>
    <rect class="fur" x="370" y="240" width="44" height="16"/>
    <rect class="fur" x="396" y="203" width="14" height="22"/>
    <circle class="fur" cx="435" cy="285" r="16"/>
    <rect class="fire" x="548" y="92" width="30" height="80"/>
    <rect class="fur" x="516" y="100" width="22" height="30"/>
    <text class="label" x="508" y="152">장작</text>
    <rect class="fur" x="470" y="336" width="80" height="30"/>
    <text class="label" x="378" y="164">책상</text>
    <text class="label" x="232" y="76">서가</text>
    <text class="label" x="268" y="372">문</text>
    ${spots}
  </svg>`;
}

function renderMain(){
  const m = $('#main');
  if(S.view==='scene'){
    m.innerHTML = `<div class="main-head"><h2>현장 · 서재</h2><span class="hint">빛나는 지점을 눌러 조사하세요</span></div>
      <div class="plan-wrap">${planSVG()}</div>`;
    return;
  }
  const p = P[S.who], t = TALK[S.who];
  const ev = S.got.filter(id=>!CLUES[id].note);
  m.innerHTML = `<div class="main-head"><h2>심문</h2><button class="btn" data-back>◂ 현장으로</button></div>
    <div class="interro">
      <div class="big-ph" id="bigph">${portrait(p,S.ex)}</div>
      <div class="talk">
        <div class="who">${p.name}<small>${p.role}</small></div>
        <div class="bubble${S.newLine?' new':''}">${S.line||t.intro}</div>
        <div class="row-label">질문하기</div>
        <div class="chips">${t.topics.map((q,i)=>`<button class="chip" data-topic="${i}">${q.l}</button>`).join('')}</div>
        <div class="row-label">단서 제시</div>
        <div class="chips">${ev.length?ev.map(id=>`<button class="chip ev" data-ev="${id}">${CLUES[id].n}</button>`).join(''):'<span class="empty">아직 제시할 물증이 없어요. 현장을 먼저 조사해 보세요.</span>'}</div>
      </div>
    </div>`;
}

const rot = id => { let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))%997; return ((h%9)-4)*0.9; };
function cardHTML(id, extra){
  const c = CLUES[id];
  if(c.note) return `<article class="card note${extra||''}" data-card="${id}" style="--r:${rot(id)}deg"><h3>${c.n}</h3><p>${c.d}</p><span class="by">진술 · ${c.by}</span></article>`;
  return `<article class="card${extra||''}" data-card="${id}" style="--r:${rot(id)}deg">
    <div class="photo">${glyph(c.g)}<span class="id">${id}</span><span class="tp">${c.t}</span></div>
    <h3>${c.n}</h3><p>${c.d}</p></article>`;
}
function renderBoard(){
  const cork = $('#cork');
  cork.querySelectorAll('.card,.cork-empty').forEach(n=>n.remove());
  if(!S.got.length){cork.insertAdjacentHTML('beforeend','<div class="cork-empty">아직 아무것도 붙어 있지 않아요</div>')}
  S.got.forEach(id=>cork.insertAdjacentHTML('beforeend', cardHTML(id, id===S.fresh?' fresh':'')));
  $('#cnt').textContent = S.got.length;
  S.fresh = null;
  requestAnimationFrame(drawThreads);
}
function drawThreads(){
  const cork=$('#cork'), svg=$('#threads'), b=cork.getBoundingClientRect();
  const pt = id => { const el=cork.querySelector(`[data-card="${id}"]`); if(!el) return null;
    const r=el.getBoundingClientRect(); return [r.left-b.left+r.width/2, r.top-b.top+2]; };
  svg.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);
  svg.innerHTML = LINKS.map(([a,c])=>{const p=pt(a),q=pt(c); return p&&q?`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}"/>`:''}).join('');
}
function render(){renderSide();renderMain();renderBoard()}

/* ---------- 이벤트 ---------- */
function investigate(id){
  const s = SPOTS.find(x=>x.id===id);
  if(s.lock && !S.pc){toast('비밀번호가 걸려 있다. 아는 사람이 있을지도…');return}
  const next = s.clues.find(c=>!has(c));
  if(!next){toast('더 이상 찾을 것은 없어 보인다.');return}
  gain(next); render();
}
function shakePortrait(){const b=$('#bigph'); if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-spot],[data-place],[data-who],[data-topic],[data-ev],[data-back]');
  if(!t) return;
  if(t.dataset.spot) investigate(t.dataset.spot);
  else if(t.dataset.place!==undefined){
    const p=PLACES[+t.dataset.place];
    if(p.lock) toast(`${p.n}은(는) 잠겨 있다.`);
    else if(+t.dataset.place!==0) toast('시안에서는 서재만 조사할 수 있어요.');
    else {S.view='scene';render()}
  }
  else if(t.dataset.who){S.view='talk';S.who=t.dataset.who;S.ex='calm';S.line='';S.newLine=false;render()}
  else if(t.dataset.topic!==undefined){
    const q=TALK[S.who].topics[+t.dataset.topic];
    S.line=q.a; S.ex=q.ex||'calm'; S.newLine=false;
    if(q.get && gain(q.get)) S.newLine=true;
    if(q.unlock && !S.pc){S.pc=true;setTimeout(()=>toast('서재 PC를 조사할 수 있게 됐다.'),1900)}
    render(); if(S.ex!=='calm') shakePortrait();
  }
  else if(t.dataset.ev){
    const r=TALK[S.who].react[t.dataset.ev];
    S.line = r? r.a : TALK[S.who].def; S.ex = r? r.ex : 'calm'; S.newLine=false;
    render(); if(r && r.ex!=='calm') shakePortrait();
  }
  else if(t.hasAttribute('data-back')){S.view='scene';render()}
});
document.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('[data-spot]');
  if(t && (e.key==='Enter'||e.key===' ')){e.preventDefault();investigate(t.dataset.spot)}
  if(e.key==='Escape' && !$('#show').hidden) closeShow();
});
addEventListener('resize',()=>requestAnimationFrame(drawThreads));
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>requestAnimationFrame(drawThreads));

/* ---------- 추리쇼 ---------- */
const STEPS = [
  {line:'이건 사고가 아닙니다.',sub:'사다리 발판에는 먼지가 그대로였어요. 피해자는 사다리에 오른 적이 없습니다.',clue:'C03'},
  {line:'여러분이 들은 22시 30분의 목소리는…',sub:'피해자의 목소리가 아니었습니다. 누군가 미리 예약해 둔 녹음이었죠.',clue:'C07'},
  {line:'진짜 범행 시각은 21시 40분 전후!',sub:'매일 밤 10시 정각에 넣던 장작이, 그날만은 그대로 남아 있었으니까요.',clue:'C06'}
];
let step=0;
function drawStep(){
  const s=STEPS[step], sh=$('#show');
  $('#showInner').innerHTML = `<div><div class="show-step">추리 ${step+1} / ${STEPS.length}</div>
    <h2 class="show-line">${s.line}</h2><p class="show-sub">${s.sub}</p></div>
    <div>${cardHTML(s.clue,' slam')}</div>`;
  $('#showNext').textContent = step<STEPS.length-1 ? '다음 ▸' : '처음부터';
  sh.classList.remove('quake'); void sh.offsetWidth; sh.classList.add('quake');
}
function closeShow(){$('#show').hidden=true;$('#showBtn').focus()}
$('#showBtn').onclick=()=>{step=0;$('#show').hidden=false;drawStep();$('#showNext').focus()};
$('#showNext').onclick=()=>{step=(step+1)%STEPS.length;drawStep()};
$('#showClose').onclick=closeShow;

/* 시작 상태: 단서 몇 개를 미리 붙여 둔 진행 중 화면 */
['C04','C03','C06','S02'].forEach(id=>S.got.push(id));
render();
})();
</script>
